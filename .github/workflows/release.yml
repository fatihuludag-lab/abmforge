name: Release

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the validated distributions to TestPyPI"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish to production PyPI; requires dispatching from a valid v* tag"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate manual publish selection
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          if [ "$PUBLISH_TESTPYPI" = "true" ] && [ "$PUBLISH_PYPI" = "true" ]; then
            echo "Select only one publication target per workflow run."
            exit 1
          fi

          if [ "$PUBLISH_TESTPYPI" = "true" ] || [ "$PUBLISH_PYPI" = "true" ]; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "Package-index publishing requires dispatching the workflow from a valid v* tag."
              exit 1
            fi
          fi

      - name: Validate version consistency
        run: python scripts/check_version_consistency.py

      - name: Validate formal release metadata
        run: python scripts/check_release_metadata.py --strict

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_tag.py --tag "$GITHUB_REF_NAME"

      - name: Format check
        run: ruff format --check src tests examples scripts

      - name: Lint
        run: ruff check src tests examples scripts

      - name: Type check
        run: mypy src

      - name: Tests with coverage
        run: pytest --cov=abmforge --cov-report=term-missing --cov-fail-under=70

      - name: Documentation build
        run: mkdocs build --strict

  build:
    name: Build validated release distributions
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel in a clean virtual environment
        run: |
          python -m venv /tmp/abmforge-release-smoke
          /tmp/abmforge-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/abmforge-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/abmforge-release-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"

      - name: Generate distribution checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abmforge-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: abmforge-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: abmforge-dist
          path: dist

      - name: Download checksum artifact
        uses: actions/download-artifact@v4
        with:
          name: abmforge-checksums
          path: .

      - name: Verify downloaded distribution checksums
        run: sha256sum --check SHA256SUMS

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/abmforge/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: abmforge-dist
          path: dist

      - name: Download checksum artifact
        uses: actions/download-artifact@v4
        with:
          name: abmforge-checksums
          path: .

      - name: Verify downloaded distribution checksums
        run: sha256sum --check SHA256SUMS

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
